name: TaskbotWidget
options:
  deploymentTarget:
    macOS: "14.0"
# Prefijo del bundle id y equipo de firma: Config.xcconfig (+ Local.xcconfig, que no se sube a git).
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.9"
targets:
  Taskbot:
    type: application
    platform: macOS
    sources:
      - path: TaskbotApp
      - path: Shared/CompleteTaskIntent.swift
      - path: Shared/TaskbotEndpoint.swift
      - path: Shared/AppGroup.swift
    dependencies:
      - target: TaskbotWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TASKBOT_BUNDLE_PREFIX).taskbot
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Taskbot — Notas
        INFOPLIST_KEY_CFBundleVersion: "1"
        INFOPLIST_KEY_CFBundleShortVersionString: "1.0"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSAppleEventsUsageDescription: Taskbot actualiza una nota con tus tareas pendientes.
        INFOPLIST_KEY_NSRemindersFullAccessUsageDescription: Taskbot mantiene tus tareas en la lista "Taskbot" de Recordatorios y marca como hechas las que completes allí.
        INFOPLIST_KEY_NSRemindersUsageDescription: Taskbot mantiene tus tareas en la lista "Taskbot" de Recordatorios.
        CODE_SIGN_ENTITLEMENTS: TaskbotApp/Taskbot.entitlements
        CODE_SIGN_STYLE: Automatic
        REGISTER_APP_GROUPS: YES
        ENABLE_APP_SANDBOX: YES
        SWIFT_EMIT_LOC_STRINGS: YES
  TaskbotWidgetExtension:
    type: app-extension
    platform: macOS
    sources:
      - path: TaskbotWidget
      - path: Shared/CompleteTaskIntent.swift
      - path: Shared/TaskbotEndpoint.swift
      - path: Shared/AppGroup.swift
    info:
      path: TaskbotWidget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(TASKBOT_BUNDLE_PREFIX).taskbot.macoswidget
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_KEY_CFBundleDisplayName: Taskbot Widget
        CODE_SIGN_ENTITLEMENTS: TaskbotWidget/TaskbotWidget.entitlements
        CODE_SIGN_STYLE: Automatic
        REGISTER_APP_GROUPS: YES
        ENABLE_APP_SANDBOX: YES
        SWIFT_EMIT_LOC_STRINGS: YES
